services:
  - type: web
    name: internmatch
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --timeout 120
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.5
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_EMAIL
        value: admin@internmatch.local
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DEMO_STUDENT_EMAIL
        value: demo.student@internmatch.local
      - key: DEMO_STUDENT_PASSWORD
        value: Demo@123
