<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Camera</title>
    <style>
        html, body {
            margin: 0;
            width: 100%;
            height: 100%;
            background: #111827;
            overflow: hidden;
        }
        video {
            display: block;
            width: 100%;
            height: 100%;
            object-fit: contain;
            background: #111827;
        }
    </style>
</head>
<body>
    <video id="preview" autoplay muted playsinline></video>
    <script>
        const preview = document.getElementById("preview");
        let stream = null;

        function send(type) {
            if (window.parent) {
                window.parent.postMessage({ source: "internmatch-camera", type: type }, "*");
            }
        }

        function stopStream() {
            if (!stream) {
                return;
            }
            stream.getTracks().forEach(function (track) {
                track.stop();
            });
            stream = null;
            preview.srcObject = null;
        }

        async function startStream() {
            stopStream();
            stream = await navigator.mediaDevices.getUserMedia({ video: true });
            preview.srcObject = stream;
            await preview.play();
            send("ready");
        }

        window.addEventListener("message", function (event) {
            const data = event.data || {};
            if (data.source !== "internmatch-camera-parent") {
                return;
            }
            if (data.type === "stop") {
                stopStream();
            }
            if (data.type === "toggle") {
                if (!stream) {
                    startStream().catch(function () {
                        send("blocked");
                    });
                    return;
                }
                stream.getVideoTracks().forEach(function (track) {
                    track.enabled = !track.enabled;
                });
                send(stream.getVideoTracks()[0] && stream.getVideoTracks()[0].enabled ? "on" : "off");
            }
        });

        window.addEventListener("beforeunload", stopStream);
        startStream().catch(function () {
            send("blocked");
        });
    </script>
</body>
</html>
