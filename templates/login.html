<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | InternMatch AI</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    {% include "partials/navbar.html" %}

    <main class="auth-page">
        <div class="container">
            <section class="auth-card auth-card-narrow">
                <p class="badge">Welcome Back</p>
                <h1>Student Login</h1>
                <p class="auth-subtitle">Log in to open your dashboard.</p>

                <form method="POST" action="{{ url_for('login') }}">
                    <div class="form-group">
                        <label for="email">Email</label>
                        <input type="email" id="email" name="email" required>
                    </div>
                    <div class="form-group">
                        <label for="password">Password</label>
                        <input type="password" id="password" name="password" required>
                    </div>
                    <button class="btn" type="submit">Login</button>
                </form>

                <p class="auth-switch">New student? <a href="{{ url_for('register') }}">Create an account</a></p>
                <p class="auth-switch">Administrator? <a href="{{ url_for('admin.login') }}">Admin login</a></p>
            </section>
        </div>
    </main>
</body>
</html>
